[platformio]
default_envs = selector

[multiboot]
version = 0.1.0

[base]
; pioarduino build of the ESP32 Arduino core, matching the reference firmwares.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; The selector lives in the factory partition.
board_upload.offset_address = 0x10000
board_build.partitions = partitions/multiboot-2slot.csv

; The one-shot boot mode relies on the bootloader rollback feature: an image
; started in state ESP_OTA_IMG_NEW is aborted on the next reset unless it calls
; esp_ota_mark_app_valid_cancel_rollback(), which guest firmwares never do.
; See docs/boot-flow.md.
custom_sdkconfig =
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1
  -DMULTIBOOT_VERSION=\"${multiboot.version}\"
  -std=gnu++2a
  -fno-exceptions
  -Wall
  -Wextra

build_unflags =
  -std=gnu++11
  -fexceptions

lib_deps =
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager

[env:selector]
extends = base
build_flags =
  ${base.build_flags}
  -DMULTIBOOT_ENABLE_SERIAL_LOG

; Release build: no serial logging, smallest binary.
[env:release]
extends = base

; Three 4 MiB slots instead of two 6 MiB slots.
[env:selector_3slot]
extends = base
board_build.partitions = partitions/multiboot-3slot.csv

; Five ~2.4 MiB slots, for small firmwares only.
[env:selector_5slot]
extends = base
board_build.partitions = partitions/multiboot-5slot.csv

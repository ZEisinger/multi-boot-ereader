name: PR Manual Test Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-artifacts:
    name: Build firmware artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [selector, selector_3slot, selector_5slot]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Package ${{ matrix.env }} binaries
        run: |
          mkdir -p artifacts/${{ matrix.env }}
          cp .pio/build/${{ matrix.env }}/bootloader.bin artifacts/${{ matrix.env }}/
          cp .pio/build/${{ matrix.env }}/partitions.bin artifacts/${{ matrix.env }}/
          cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/${{ matrix.env }}/
      - name: Upload ${{ matrix.env }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}-binaries
          path: artifacts/${{ matrix.env }}

  web-installer:
    name: Package web installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload web installer files
        uses: actions/upload-artifact@v4
        with:
          name: web-installer
          path: web

  deploy-web-installer:
    name: Deploy web installer to GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: web-installer
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
